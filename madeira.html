<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madeira e Cia - Promoção</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="container">

        <h1>Madeira e Cia</h1>

        <p class="subtitulo">
            Promoção de Aniversário
        </p>

        <form action="processa.php" method="POST">

            <label for="txtNome">Nome do cliente:</label>

            <input
                type="text"
                id="txtNome"
                name="txtNome"
                placeholder="Digite seu nome"
                required
            >

            <label for="txtValorCompra">Valor da compra:</label>

            <input
                type="number"
                id="txtValorCompra"
                name="txtValorCompra"
                placeholder="0,00"
                min="0"
                step="0.01"
                required
            >

            <label for="cmbPag">Forma de pagamento:</label>

            <select
                id="cmbPag"
                name="cmbPag"
                required
            >
                <option value="">Selecione uma opção</option>

                <option value="deposito">
                    Depósito
                </option>

                <option value="boleto">
                    Boleto
                </option>

                <option value="cartaoCredito">
                    Cartão de crédito
                </option>
            </select>

            <button type="submit">
                Calcular desconto
            </button>

        </form>

        <div class="promocao">

            <strong>Promoção:</strong><br>

            Depósito: 10% de desconto |
            Boleto: 8% de desconto |
            Cartão: sem desconto

        </div>

    </div>

</body>

</html>
